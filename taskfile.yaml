# taskfile-go
version: '3'
tasks:
  data_ck:
    desc: Check the Python Script
    cmds:
      - python compiler/pyvm_bc.py assets/test.py

  data_mk:
    desc: Make Data
    cmds:
      - python compiler/pyvm_bc.py assets/test.py | xxd -r -p > assets/test.bin

  run:
    desc: Run the Python Script
    cmds:
      - swift run --package-path swiftVM

  build:
    desc: Build the Swift VM
    cmds:
      - swift build --package-path swiftVM

  test_py:
    desc: Compile the Python test script into assets/test.bin
    cmds:
      - mkdir -p swiftVMTest/.build
      - python compiler/pyvm_bc.py swiftVMTest/test.py | xxd -r -p > swiftVMTest/.build/test.bin

  test_swift:
    desc: Run the Swift test harness against .build/test.bin
    cmds:
      - swift run --package-path swiftVMTest

  default:
    cmds:
      - task --list